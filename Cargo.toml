[package]
name = "age-credentials"
version = "1.0.0"
edition = "2024"
description = "Account management engine based on Age encryption – pure engine, no default backend"
license = "MIT"
repository = "https://github.com/mroczect/age-credentials"

[dependencies]
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }
sha2 = "0.11"
tempfile = "3.27.0"
age = "0.12.1"
toml = "1.1.4"
librage = "1.1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }